name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install backend dependencies
      run: python -m pip install -r backend/requirements.txt
    - name: Start backend
      working-directory: backend
      run: |
        rm -f preguntas.db preguntas.db-shm preguntas.db-wal
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/qa-test-lab-backend.log 2>&1 &
        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:8000/docs > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat /tmp/qa-test-lab-backend.log
        exit 1

    - name: Install dependencies
      run: npm ci
    - name: Build application
      run: npm run build
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.browser }} --add-reporter html
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30
